<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Enterprise Document Chatbot</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>📄 Documents</h1>
    <form id="upload-form">
      <input type="file" id="file-input" accept=".pdf,.docx,.txt,.md" required />
      <button type="submit">Upload</button>
    </form>
    <p id="upload-status" class="status"></p>
    <ul id="doc-list"></ul>
  </aside>

  <main class="chat">
    <h1>Enterprise RAG Chat</h1>
    <p class="subtitle">Running fully local: LangChain + Ollama + Chroma</p>
    <div id="messages" class="messages"></div>
    <form id="chat-form">
      <input type="text" id="question-input" placeholder="Ask a question about your documents..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
